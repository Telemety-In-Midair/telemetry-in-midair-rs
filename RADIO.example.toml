# RADIO.CFG - WIO-E5 configuration reference.
#
# This is the reference, not a drop-in card file: the firmware reads at most
# 1024 bytes of config and the documentation below puts this file several
# times over that. Strip the comments and the _description/_type keys and
# what remains is about 500 bytes, which fits. The tools do that for you:
#
#   cd tools && pixi run wio-config --address 3                 # push it
#   cd tools && pixi run wio-config --address 3 --dry-run \
#                                   --save ../RADIO.CFG         # card file
#
# The card file goes in the SD root as RADIO.CFG (uppercase). A config
# pushed over USB or BLE is applied live and written to both the card and a
# backup page in the WIO's internal flash, so it survives a power cycle on a
# board with no card. At boot the card wins over the backup, so pulling the
# card to edit RADIO.CFG on a computer does what it looks like it does.
#
# Every key is optional - an absent key keeps its default, and an empty
# file is valid. Section headers are cosmetic: keys are unique across
# sections, so a key works regardless of which [section] it sits under.
#
# Each setting is paired with a "<key>_description" string. The firmware
# ignores unknown keys, so these descriptions are inert to the WIO - they
# exist so an editor or UI that changes these values can show help text.
# The values below are the firmware defaults.
#
# A setting may also carry a "<key>_type" string to tell such an editor which
# input to show. It is optional: int/float/bool/string are inferred from the
# value, so a type is only worth setting to constrain a string to a fixed set
# of choices, written "enum:a,b,c" (rendered as a dropdown). Also inert to the
# WIO.

# -- Radio --------------------------------------------------------------
# frequency, spreading factor, bandwidth, coding rate and power are the
# LoRa link-budget knobs: together they set sensitivity, on-air time and
# radiated power - i.e. range.
[radio]
frequency_hz = 915000000
frequency_hz_description = "RF center frequency in Hz. Valid 150000000-960000000."

spreading_factor = 12
spreading_factor_description = "LoRa spreading factor, 5-12. Higher gives longer range at a lower data rate."

bandwidth_khz = 500
bandwidth_khz_description = "LoRa bandwidth in kHz: 62, 125, 250 or 500 (62 means 62.5). Narrower gives longer range at a lower data rate, but only 500 is wide enough to count as a digital modulation in the 902-928 MHz band - narrower settings there have to hop across 50 channels instead of sitting on one."

coding_rate = 5
coding_rate_description = "Coding rate denominator 5-8 for 4/5..4/8. Higher adds forward error correction at a lower data rate."

power_dbm = 22
power_dbm_description = "Transmit power in dBm, -9 to 22 on the high-power PA."

rx_boost = true
rx_boost_description = "Boosted receiver gain: roughly +2 dB of sensitivity for a few mA more current whenever the node is listening."

# The four keys below describe the board the firmware is running on, not a
# preference. The defaults are the Wio-E5's own hardware; change them only
# for a different module, where a wrong value means a radio that does not
# start rather than one that performs badly.
# dcdc_enabled = true
# dcdc_enabled_description = "Use the internal DC-DC (SMPS) WIO-E5 supports this."

# dio2_rf_switch = false
# dio2_rf_switch_description = "Let the radio drive its own antenna switch from DIO2 (SetDio2AsRfSwitchCtrl). On for a module whose RF port runs into an external switch or front-end, off for one that feeds a connector directly. The Wio-E5's radio is on-die with no bonded DIO2, so it ignores this and switches the antenna from MCU pins."

# tcxo_volts = "1.8"
# tcxo_volts_description = "Supply the radio drives the TCXO at. Wio-E5 uses a 1.8V part."
# tcxo_volts_type = "enum:1.6,1.7,1.8,2.2,2.4,2.7,3.0,3.3"

# tcxo_startup_ms = 10
# tcxo_startup_ms_description = "How long the radio waits for the TCXO to settle before using the clock, 1-1000 ms."

# -- Network ------------------------------------------------------------
# Everything is sent. Leaves hear each other directly, so a fleet of
# nothing but leaves is a working network and these defaults need no
# changing. A repeater is for covering ground no pair of leaves can reach
# across on their own. tx_only and rx_only split a leaf in half, for a
# deployment where the reporting only ever runs one way.
[network]
address = 1
address_description = "This node's address, 1-255. Must be unique among the nodes that transmit: two senders sharing an address are mutually deaf, each dropping the other's broadcasts as an echo of its own, so neither ever sees the other. An rx_only node never puts its address on the air, so it can keep the default."

role = "leaf"
role_description = "leaf transmits its own position and receives everyone else's. Repeater also retransmits other nodes' broadcasts, extending range past one radio horizon at the cost of doubling the traffic it forwards. tx_only beacons without ever switching the receiver on, which is the largest power saving available to a node nobody needs to track from. rx_only listens without ever transmitting, for a base station that only collects."
role_type = "enum:leaf,repeater,tx_only,rx_only"

max_hops = 1
max_hops_description = "Retransmissions allowed for a broadcast this node sends, 0-8. 0 means no repeater forwards it."

dedup_ttl_s = 3
dedup_ttl_s_description = "How long a broadcast is remembered so a repeat of it is dropped rather than delivered or forwarded again, 1-3600 s. Keep it well under the time the beacon runs through 256 ids (about 85 min at the 20 s default), or a node starts suppressing its own later broadcasts as duplicates."

# -- Beacon -------------------------------------------------------------
[beacon]
interval_s = 20
interval_s_description = "Broadcast period in seconds, 0-3600. Each slot carries a position, or a small ping when there is no fix, so a node that cannot see the sky is still heard. 0 disables both, as does a role of rx_only."

fields = "lat,lon"
fields_description = "Which GPS fields each broadcast carries: lat, lon, altitude, speed, course, sats, time. lat and lon are required. More fields result in more air time."

# -- SD card ------------------------------------------------------------
[sd]
sd_enabled = true
sd_enabled_description = "Use the SD card. false stops position logging and the card's power draw. The config itself still persists: it is backed up to the WIO's internal flash either way."

# -- Debug --------------------------------------------------------------
[debug]
verbose = true
verbose_description = "Log every link frame and heartbeat on the ESP's USB console, on top of the events that are always logged. Costs nothing when nothing is attached; turn it off for a quiet console or when a tool is parsing it."

# -- GPS ----------------------------------------------------------------
# MAX-M10 receiver, applied as one UBX-CFG-VALSET to the RAM layer. An
# absent [gps] section leaves the module at its factory concurrent set.
[gps]
gps_enabled = true
gps_enabled_description = "Enable the GPS (US) constellation."

glonass_enabled = false
glonass_enabled_description = "Enable the GLONASS (Russia) constellation. The M10 tracks a limited concurrent set."

galileo_enabled = true
galileo_enabled_description = "Enable the Galileo (EU) constellation."

beidou_enabled = true
beidou_enabled_description = "Enable the BeiDou (China) constellation."

qzss_enabled = true
qzss_enabled_description = "Enable the QZSS (Japan) augmentation."

sbas_enabled = true
sbas_enabled_description = "Enable SBAS augmentation (WAAS, EGNOS and similar)."

power_mode = "full"
power_mode_description = "GPS power mode: full, psmoo (power-save on/off) or psmct (power-save cyclic tracking)."
power_mode_type = "enum:full,psmoo,psmct"

meas_rate_ms = 1000
meas_rate_ms_description = "GPS measurement and navigation period in ms, 25-10000."

dynamic_model = "portable"
dynamic_model_description = "GPS motion model: portable, stationary, pedestrian, automotive, sea, airborne1g, airborne2g or airborne4g."
dynamic_model_type = "enum:portable,stationary,pedestrian,automotive,sea,airborne1g,airborne2g,airborne4g"
