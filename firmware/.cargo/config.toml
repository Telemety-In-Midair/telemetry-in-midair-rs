[target.xtensa-esp32s3-none-elf]
# The partition table has two OTA slots rather than one factory app, so it
# has to be named here - espflash defaults to a single-app table that has
# nowhere to put an update.
#
# `--erase-parts otadata` is what keeps a USB flash authoritative. Without
# it, a board that took an over-the-air update is booting ota_1, and the
# image this writes into ota_0 would sit unused until the next OTA - which
# looks exactly like a flash that did not take. Erased otadata falls back to
# the first app slot, which is the one just written.
runner = """espflash flash --monitor --chip esp32s3 --flash-size 16mb --partition-table partitions.csv --target-app-partition ota_0 --erase-parts otadata"""

[env]

[build]
# No `-C force-frame-pointers` here, deliberately. Forcing it is what a
# RISC-V part needs to give esp-backtrace something to walk; this one is
# Xtensa, where the backtrace comes from the windowed-ABI register spill
# area instead and the flag buys nothing. esp-backtrace agrees - its build
# script only inspects the flag when the chip is not Xtensa.
#
# It is not merely useless here, it is fatal: with the frame pointer
# reserved the register scavenger runs out of room and LLVM aborts codegen
# of the final binary,
#
#   rustc-LLVM ERROR: Error while trying to spill A6 from class AR:
#   Cannot scavenge register without an emergency spill slot!
#
# which is an error from the backend, not from rustc, so `cargo check`
# passes and only `cargo build` fails.
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
