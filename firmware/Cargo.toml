[package]
edition      = "2024"
name         = "wio-s3-gps"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "wio-s3-gps"
path = "./src/bin/main.rs"

[features]
default = ["dual-core"]

# Run the hardware loop - radio, GPS, card, panel - on the S3's second
# core, with the BLE host, the USB console and the GPS byte pump on the
# first. The loop's blocking work (a card flush, a receive poll's SPI, a
# UART flush) then never holds the BLE host, and the host's work never
# delays the loop's 10 ms pass. Turn it off to run everything on one core,
# as the firmware did before the feature existed.
dual-core = []

# Power isolation builds. Each one removes a load so that its contribution
# to the board's current can be had by subtraction rather than estimated;
# they compose, so four flashes give a 2x2. Never ship one - a board built
# with any of these is missing a subsystem on purpose.
#
#   (none)                    the real firmware, the baseline reading
#   iso-no-ble                everything but the radio and BLE stack
#   iso-no-app                BLE only, no hardware loop
#   iso-no-ble + iso-no-app   the bare chip, USB console only
#
# Neither flag powers the GPS or the SX1262 down - both sit on the
# always-on +3V3 with no gate - so an app-less build still carries a
# free-running MAX-M10 at its factory default. `iso-gps-backup` is the
# lever for that one.
iso-no-ble = []
iso-no-app = []
# Send the GPS straight to UBX-RXM-PMREQ backup once the UART is up, so the
# receiver's own draw can be measured. V_BCKP is unconnected on this board,
# so waking it again is not established - expect to power-cycle.
iso-gps-backup = []
# Build the BLE controller without modem sleep, the way the crate ships. The
# firmware turns modem sleep on, so this is the other half of the A/B: flash
# both and the difference is what the controller saves by powering its PHY
# down between events. Advertising costs the same either way, so measure
# while advertising, and again while a phone is connected and idle.
iso-ble-no-modem-sleep = []

# The wake-on-radio bench, in two halves that want two boards. Each takes
# the board over instead of running the hardware loop, so both need a mode
# that brings the radio up (`board-set mode listening`) and both expect the
# same radio settings at each end.
#
#   iso-sentry-probe   arm the receiver's sniff loop several ways and count
#                      the wakes each one produces, off DIO1 alone
#   iso-sentry-source  send wake frames behind a long preamble, numbered
#
# `iso-sentry-source` keys the PA for seconds at a time. Turn the power down
# first (`board-config --set power_dbm=0`), and never build both into one
# image.
iso-sentry-probe = []
iso-sentry-source = []
# The source as a bare carrier instead of frames: keys a continuous preamble
# so a duty-cycled receiver has something always present to detect. That is
# what the window sweep measures against - it asks whether a window detects,
# not whether it receives, so a signal that never becomes a packet is the
# right one. Never build it with iso-sentry-source.
iso-sentry-carrier = []
# Watch the duty cycle from outside the SPI bus. Arms a sentry and then does
# nothing but observe BUSY, which is an input to the host and so costs no
# transaction and produces no NSS edge - the one thing about this part that
# can be watched without disturbing it. Times the cycle itself, and mirrors
# BUSY and DIO1 onto the J1 header so an external monitor can confirm the
# timing independently of this firmware's own clock.
iso-sentry-mirror = []

# Bench faults, for proving the watchdog and the event log on a board.
# Twenty seconds after the hardware loop is up, `bench-panic` panics on its
# core and `bench-stall` stops it in a spin. Either build resets itself
# within its bound and the boot after says so; neither is ever shipped.
bench-panic = []
bench-stall = []
# `bench-hang` stops the first core's executor in a spin instead, twenty
# seconds after boot: the monitor never runs again, and the watchdog's
# warning on the second core is what has to say so.
bench-hang = []

[dependencies]
# Same versions the retired ESP32-C6 firmware ran, retargeted at the S3: the
# matched esp-rtos 0.2 / esp-radio 0.17 pair expects esp-hal 1.0.x.
esp-hal = { version = "~1.0", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }

esp-alloc = "0.9.0"
# For the backtrace alone. Its panic handler is not used: it spins the
# panicking core forever, which on a two-core board stops the other core
# at its next critical section and freezes the board with nothing written
# down. The firmware's own handler (src/panic.rs) records the panic in RTC
# RAM, prints it, and resets.
esp-backtrace = { version = "0.18.1", default-features = false, features = [
  "esp32s3",
  # Its build script insists on a print backend even with the handler off.
  "println",
] }
# The console lives on the USB Serial/JTAG port (GPIO19/20 to the USB-C
# J3), not on UART0: GPIO43 is wired to the D5 LED on this board.
esp-println = { version = "0.16.1", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
  "colors",
] }

embassy-executor = { version = "0.9.1", features = [] }
embassy-futures  = "0.1"
embassy-sync     = "0.7"
embassy-time     = "0.5.0"

# BLE. Same stack the C6 runs; the bigger packet-pool MTU lets a central
# negotiate a large ATT MTU for the bulk transfer characteristic.
bt-hci = "0.6.0"
esp-radio = { version = "0.17.0", features = [
  "ble",
  "esp-alloc",
  "esp32s3",
  "unstable",
  # Uncomment to power the modem domain down on BLE teardown - worth a few
  # mA per dark period, and unproven. If the board comes up with no BLE at
  # all and the console says "radio init failed, retrying", this is why:
  # cycling the domain can leave the controller unable to re-initialize.
  # "radio-power-down",
] }
trouble-host = { version = "0.5.0", features = [
  "gatt",
  "default-packet-pool-mtu-251",
] }
static_cell = "2.1.1"

critical-section = "1.2.0"
heapless         = "0.9"
# RTC-RAM statics that survive deep sleep: esp-hal's `Persistable` marker
# covers atomics, and core's are not available on every target it builds for.
portable-atomic = "1"

# Trig for the compass heading. The bearing math itself lives in
# midair-proto, which pulls the same crate.
libm = "0.2"

# The USB Serial/JTAG console, which the host tools speak the bulk protocol
# over.
embedded-io-async = "0.7.0"

# The `nvs` settings mirror and the OTA slots. 0.8 is the release that
# matches esp-hal 1.0.
esp-storage      = { version = "0.8.1", features = ["esp32s3"] }
embedded-storage = "0.3.1"

# Board link protocol, BLE extensions and radio config. Host-tested.
midair-proto = { path = "../proto" }
# Shared BLE position protocol and NMEA parsing.
gps-proto = { path = "../../gps-proto" }

# esp-radio is vendored for two things, and both are BLE power.
#
# The small one: it re-exports the `TxPower` enum, which upstream keeps
# crate-private while exposing the builder that takes it, so BLE TX can be
# dropped from the +9 dBm default to 0 dBm.
#
# The large one: the controller's modem sleep, which upstream leaves
# unimplemented rather than merely unconfigured - the callbacks the
# controller uses to sleep were `todo!()` and `ble_init` ran none of the
# enabling sequence, so setting the two config literals did nothing (it was
# tried, and measured). Both are written now, ported from ESP-IDF's
# `components/bt/controller/esp32c3/bt.c`, which is the file that serves
# the S3. The code and what it deliberately leaves out are in the modem
# sleep section of `src/ble/btdm.rs`.
#
# Going back to the published crate is no longer a one-line change: it
# costs the modem sleep as well as the TX power, and the
# `with_modem_sleep`/`with_default_tx_power` calls in `main` would have to
# go with it.
[patch.crates-io]
esp-radio = { path = "vendor/esp-radio" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
