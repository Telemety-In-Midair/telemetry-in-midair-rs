[workspace]
name = "midair-tools"
version = "0.1.0"
description = "Host tools for the telemetry-in-midair board"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
pyserial = ">=3.5"

[tasks]
# Push a radio config to the board over USB, applied live and saved to its
# SD card:
#   pixi run wio-config --address 3
#   pixi run wio-config --address 3 --set role=tx_only
# Sends a whole file (default ../RADIO.example.toml, i.e. firmware defaults
# plus the edits given), since the board cannot be read back - use --file to
# start from settings of your own, and --dry-run to see the result first.
#
# Needs the USB console and its bulk handler, which the Wio-S3 firmware has
# not ported yet (PORT-WIO-S3.md, step 4b). The framing itself is unchanged,
# so this tool is waiting on the firmware rather than on a rewrite.
wio-config = "python wio_config.py"

# Generate a random BLE static-random address in the display format the
# firmware expects:
#   pixi run gen-ble-address
#
# Nothing consumes it yet. The ESP32-C6 build derived each board's address
# from its eFuse MAC and let this override it; that is still to be ported.
gen-ble-address = "python gen_ble_address.py"