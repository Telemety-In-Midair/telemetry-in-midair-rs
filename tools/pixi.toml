[workspace]
name = "midair-tools"
version = "0.1.0"
description = "Host tools for the telemetry-in-midair board"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
pyserial = ">=3.5"

[tasks]
# Push a radio config to the board over USB, applied live and saved to its
# SD card:
#   pixi run board-config --address 3
#   pixi run board-config --address 3 --set role=tx_only
# Sends a whole file (default ../RADIO.example.toml, i.e. firmware defaults
# plus the edits given), since this tool cannot read the board back - use
# --file to start from settings of your own, and --dry-run to see the result
# first.
board-config = "python board_config.py"

# Update the firmware over USB, into the OTA slot the board is not running
# from, with no reflash and no BOOT button:
#   pixi run board-ota
#   pixi run board-ota --image firmware.bin
# With no --image it builds ../firmware and converts the ELF itself.
board-ota = "python board_ota.py"

# Read the board's protocol version and BLE address:
#   pixi run board-info
board-info = "python board_info.py"

# Write one board setting over USB, the same path a BLE config write takes:
#   pixi run board-set ble-off 30      # BLE modem down 30 s between windows
#   pixi run board-set ble-off 0       # never take it down (the default)
#   pixi run board-set adv-window 10
# The board clamps and the ack says what it stored, so the printed value is
# what the board is running. `ble-off` is the power one - BLE is 71 mA of
# this board's 126 and the only lever on it is the controller's lifetime.
board-set = "python board_set.py"

# Put the board into deep sleep now, rather than waiting out an advertising
# window with nothing connected - which is otherwise the only way in:
#   pixi run board-sleep
#   pixi run board-sleep --seconds 30
# With no --seconds the board uses its configured wake-check interval. The
# port disappears while it sleeps; that is the command working.
board-sleep = "python board_sleep.py"

# Simulate a few boards on the hop plan - the clock, the receiver, the GPS
# UART, the card and the BLE notifier - and report what a receiver and a
# phone see, before and after the fixes in docs/RADIO-AUDIT.md:
#   pixi run radio-sim
#   pixi run radio-sim --scenario B --seeds 6
#   pixi run radio-sim --gantt B --variant legacy
#   pixi run radio-sim --selftest    # after editing proto/src/hop.rs, with
#                                    # cargo run --example hop_vectors > hop_vectors.json
radio-sim = "python radio_sim.py"

# Generate a random BLE static-random address in the display format the
# firmware expects:
#   pixi run gen-ble-address
#
# Only needed to pin a board to a fixed address - `firmware/build.rs` validates
# BLE_ADDRESS and the firmware otherwise derives one per chip from the eFuse
# MAC, so boards are already distinct without it.
gen-ble-address = "python gen_ble_address.py"
