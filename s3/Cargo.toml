[package]
edition      = "2024"
name         = "wio-s3-gps"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "wio-s3-gps"
path = "./src/bin/main.rs"

[features]
default = []

# Power isolation builds. Each one removes a load so that its contribution
# to the board's current can be had by subtraction rather than estimated;
# they compose, so four flashes give a 2x2. Never ship one - a board built
# with any of these is missing a subsystem on purpose.
#
#   (none)                    the real firmware, the baseline reading
#   iso-no-ble                everything but the radio and BLE stack
#   iso-no-app                BLE only, no hardware loop
#   iso-no-ble + iso-no-app   the bare chip, USB console only
#
# Neither flag powers the GPS or the SX1262 down - both sit on the
# always-on +3V3 with no gate - so an app-less build still carries a
# free-running MAX-M10 at its factory default. `iso-gps-backup` is the
# lever for that one.
iso-no-ble = []
iso-no-app = []
# Send the GPS straight to UBX-RXM-PMREQ backup once the UART is up, so the
# receiver's own draw can be measured. V_BCKP is unconnected on this board,
# so waking it again is not established - expect to power-cycle.
iso-gps-backup = []

[dependencies]
# Same versions the esp32c6-gps crate runs, retargeted at the S3: the
# matched esp-rtos 0.2 / esp-radio 0.17 pair expects esp-hal 1.0.x.
esp-hal = { version = "~1.0", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }

esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
# The console lives on the USB Serial/JTAG port (GPIO19/20 to the USB-C
# J3), not on UART0: GPIO43 is wired to the D5 LED on this board.
esp-println = { version = "0.16.1", default-features = false, features = [
  "esp32s3",
  "jtag-serial",
  "critical-section",
  "colors",
] }

embassy-executor = { version = "0.9.1", features = [] }
embassy-futures  = "0.1"
embassy-sync     = "0.7"
embassy-time     = "0.5.0"

# BLE. Same stack the C6 runs; the bigger packet-pool MTU lets a central
# negotiate a large ATT MTU for the bulk transfer characteristic.
bt-hci = "0.6.0"
esp-radio = { version = "0.17.0", features = [
  "ble",
  "esp-alloc",
  "esp32s3",
  "unstable",
] }
trouble-host = { version = "0.5.0", features = [
  "gatt",
  "default-packet-pool-mtu-251",
] }
static_cell = "2.1.1"

critical-section = "1.2.0"
heapless         = "0.9"
# RTC-RAM statics that survive deep sleep: esp-hal's `Persistable` marker
# covers atomics, and core's are not available on every target it builds for.
portable-atomic = "1"

# Trig for the compass heading. The bearing math itself lives in
# midair-proto, which pulls the same crate.
libm = "0.2"

# The USB Serial/JTAG console, which the host tools speak the bulk protocol
# over.
embedded-io-async = "0.7.0"

# The `nvs` settings mirror and the OTA slots. 0.8 is the release that
# matches esp-hal 1.0.
esp-storage      = { version = "0.8.1", features = ["esp32s3"] }
embedded-storage = "0.3.1"

# FAT filesystem so the SD card logs are readable on a phone/computer.
# Unlike the WIO-E5 build this uses the crate's own SPI-mode SD driver:
# esp-hal implements embedded-hal 1.0, so the in-repo driver that existed
# to work around stm32wlxx-hal's 0.2 is not needed.
embedded-sdmmc = { version = "0.8", default-features = false }
embedded-hal-bus = "0.3"

# Board link protocol, BLE extensions and radio config. Host-tested.
midair-proto = { path = "../proto" }
# Shared BLE position protocol and NMEA parsing.
gps-proto = { path = "../../gps-proto" }

# esp-radio is vendored so the BLE controller's modem sleep can be turned on.
# Upstream hardcodes `sleep_mode`/`sleep_clock` to 0 in `create_ble_config`,
# matching ESP-IDF's own defaults, which leaves the BT PHY powered between
# advertising and connection events - the largest single load on this board.
# The fork sets ESP-IDF's mode 1 / main-crystal pair instead, and re-exports
# the `TxPower` enum so the +9 dBm default can be lowered.
#
# To go back to the published crate, delete this block. `vendor/esp-radio` is
# an unmodified 0.17.0 apart from the two sites marked `LOCAL PATCH`.
[patch.crates-io]
esp-radio = { path = "vendor/esp-radio" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
